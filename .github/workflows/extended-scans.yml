# Checks the repository's former in-repo quality gate ran that the QZP lean
# gate (quality.yml) does not: the lean gate's gitleaks scans the shallow
# checkout and its SAST runs opengrep with the curated .quality/opengrep rules.
# These jobs keep the full-history secret scan and the Semgrep registry packs.
name: extended scans

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: extended-scans-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks-history:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: gitleaks over every commit
        run: gitleaks git . --no-banner --redact --verbose

  semgrep-registry:
    name: SAST (Semgrep registry rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # semgrep gets a venv of its own: installed next to the project it pins
      # older releases of shared packages (mcp, opentelemetry) over the
      # project's, which is how the old gate ended up scanning those.
      - name: Install semgrep in an isolated venv
        run: |
          python -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --quiet "semgrep==1.182.1"

      - name: semgrep (p/python + p/security-audit)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: /tmp/semgrep-venv/bin/semgrep scan --config p/python --config p/security-audit --error --metrics off .

  # One fail-closed context for branch protection: green only when every
  # extended scan above succeeded (a skipped or cancelled scan fails it).
  extended-scans:
    name: extended-scans
    if: always()
    needs: [gitleaks-history, semgrep-registry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every extended scan passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "an extended scan ended with '$r' (all: $RESULTS)"; exit 1; }
          done
          echo "all extended scans passed: $RESULTS"
