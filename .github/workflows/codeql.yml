# Advanced CodeQL analysis (fleet standard 2026-11): in-repo workflow with BOTH
# query suites — security-extended + security-and-quality (strictly subsumes the
# default suite AND the extended suite) — matrixed over every language this
# repo actually ships (Python modules + GitHub Actions workflows), triggered on
# push to main, pull_request targeting main, and a weekly schedule; each
# language's SARIF is uploaded to code scanning under its own category.
#
# Replaces the QZP reusable-codeql caller, which pins queries to
# security-and-quality only (no input to add security-extended). The QZP lean
# gate (quality.yml) still runs beside this: ruff, gitleaks, opengrep SAST,
# osv-scanner, basedpyright, and pytest with the strict 100% line+branch
# coverage gate. A fail-closed `CodeQL` gate job keeps the required
# branch-protection check unsatisfiable by a skipped or cancelled analysis.
name: codeql

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # Both suites per the fleet CODEQL DECISION — strictly subsumes the
          # default suite and the extended suite.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # Fail-closed gate: the branch-protection required check `CodeQL` must never
  # be satisfied by a skipped, cancelled, or failed analysis.
  codeql-gate:
    name: CodeQL
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every language analysis passed
        env:
          # needs.*.result across the needs map (needs.analyze.*.result
          # evaluates empty for a single matrix need, which once let this
          # gate pass vacuously); the empty guard closes that hole for good.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          [ -n "$RESULTS" ] || { echo "::error title=CodeQL gate::no analysis results to gate on"; exit 1; }
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error title=CodeQL gate::an analysis ended with '$r' (all: $RESULTS)"; exit 1; }
          done
          echo "all CodeQL analyses passed: $RESULTS"
