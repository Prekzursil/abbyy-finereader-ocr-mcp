# CodeQL baseline — thin caller of quality-zero-platform's reusable workflow.
#
# Replaces the previous in-repo wrapper (python, security-and-quality) with
# the platform-managed analysis: languages resolved from the repo's QZP
# profile (actions + python), fail-closed unless the analysis succeeds, and
# every action the wrapper runs is SHA-pinned by the platform. The platform
# is checked out at this file's own workflow SHA (job.workflow_sha), so a PR
# head can never pick or drift from the scripts it runs.
name: codeql

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Prekzursil/quality-zero-platform/.github/workflows/reusable-codeql.yml@d441b32790c4aa10e1f209539ec0ddc25114968b
    with:
      repo_slug: ${{ github.repository }}
      event_name: ${{ github.event_name }}
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
